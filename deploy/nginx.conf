# Trawlbase nginx config
# Place at /etc/nginx/sites-available/trawlbase and symlink to sites-enabled.
#
# Architecture:
#   trawlbase.com/           → React frontend static files
#   trawlbase.com/scrape*    → Flask API
#   trawlbase.com/phase2*    → Flask API
#   trawlbase.com/discover*  → Flask API
#   trawlbase.com/download/* → Flask API
#   trawlbase.com/scraped-sites* → Flask API
#   trawlbase.com/a          → Flask API (analytics collection)
#   stats.trawlbase.com/     → same frontend bundle; main.jsx detects the
#                              stats. host and renders only the dashboard
#   stats.trawlbase.com/analytics/stats → Flask API (password-protected)

upstream flask_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name trawlbase.com www.trawlbase.com;

    # Frontend static files
    root /home/stefan/Projects/TrawlBase/frontend/build;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # React frontend — serve static files directly, fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flask API endpoints — proxy with SSE support
    location /scrape {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering so events stream in real time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Increase body size for CSV uploads
        client_max_body_size 10M;
    }

    location /phase2 {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 10M;
    }

    location /discover {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 10M;
    }

    location /download {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 10M;
    }

    location /scraped-sites {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Analytics collection beacon (POST /a from the frontend tracking hook).
    # "= /a" is an exact match — a prefix location would also swallow /agent.
    location = /a {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Analytics dashboard — stats.trawlbase.com serves the same frontend build;
# main.jsx sees the stats. hostname and renders only the Analytics page.
server {
    listen 80;
    server_name stats.trawlbase.com;

    root /home/stefan/Projects/TrawlBase/frontend/build;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stats API (password-protected in Flask via ANALYTICS_PASSWORD)
    location /analytics {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running certbot, it will add duplicate listen 443 server blocks here.
# You can then safely delete the port-80 blocks above or redirect HTTP→HTTPS.
# Quick SSL:  sudo certbot --nginx -d trawlbase.com -d www.trawlbase.com -d stats.trawlbase.com
